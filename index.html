<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="XAU analysis conclusions from 23 June 2026 onward.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%238a6817'/%3E%3C/svg%3E">
  <title>XAU Analysis Archive</title>
  <style>
    :root {
      --canvas: #f4f1eb;
      --paper: #fffdf9;
      --ink: #1a1a18;
      --muted: #6d6a63;
      --line: #ded8ce;
      --gold: #8a6817;
      --gold-soft: #f6edcf;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--canvas);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(100% - 32px, 980px);
      margin: 0 auto;
      padding: 48px 0 72px;
    }

    .site-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--ink);
    }

    h1,
    h2,
    p,
    dl,
    dd { margin: 0; }

    h1 {
      max-width: 640px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.35rem, 7vw, 4.35rem);
      font-weight: 500;
      line-height: 0.98;
      letter-spacing: -0.055em;
    }

    .language-picker {
      display: grid;
      gap: 6px;
      flex: 0 0 auto;
      min-width: 136px;
    }

    .language-picker label {
      color: var(--muted);
      font-size: 0.69rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    select {
      width: 100%;
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 9px 32px 9px 10px;
      background:
        linear-gradient(45deg, transparent 50%, var(--ink) 50%) calc(100% - 14px) 52% / 5px 5px no-repeat,
        linear-gradient(135deg, var(--ink) 50%, transparent 50%) calc(100% - 9px) 52% / 5px 5px no-repeat,
        var(--paper);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-size: 0.9rem;
    }

    .archive {
      display: grid;
      gap: 12px;
    }

    .entry {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: 0 1px 0 rgba(26, 26, 24, 0.025);
    }

    .entry-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 15px 18px;
      border-bottom: 1px solid var(--line);
      background: #faf7f1;
    }

    .entry-header::before {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: var(--gold);
      content: "";
    }

    .entry-header h2 {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.085em;
      text-transform: uppercase;
    }

    .conclusions {
      display: grid;
      grid-template-columns: 1fr 1.4fr 1.4fr;
    }

    .conclusion {
      min-width: 0;
      padding: 19px 18px 20px;
    }

    .conclusion + .conclusion {
      border-left: 1px solid var(--line);
    }

    dt {
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 750;
      letter-spacing: 0.1em;
      line-height: 1.35;
      text-transform: uppercase;
    }

    dd {
      margin-top: 9px;
      font-size: 0.96rem;
      font-weight: 560;
      line-height: 1.55;
    }

    .model-name {
      color: var(--gold);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.08rem;
      font-weight: 600;
      line-height: 1.35;
    }

    @media (max-width: 720px) {
      main {
        width: min(100% - 24px, 980px);
        padding-top: 28px;
      }

      .site-header {
        align-items: stretch;
        flex-direction: column;
      }

      .language-picker { width: 148px; }

      .conclusions { grid-template-columns: 1fr; }

      .conclusion + .conclusion {
        border-top: 1px solid var(--line);
        border-left: 0;
      }
    }
  </style>
</head>
<body>

          <option value="ko">한국어</option>
          <option value="zh">中文</option>
        </select>
      </div>
    </header>
    <section class="archive" id="archive" aria-live="polite"></section>
  </main>

        }

          ko: { week: "지지선을 재시험한 뒤 저점 박스권 또는 약한 반등 — 64%", month: "저점 재평가, 넓은 박스권 또는 약한 회복. 반전은 미확인 — 원본 아카이브에 명시되지 않음" },
          zh: { week: "二次测试支撑后进入低位震荡或弱反抽 — 64%", month: "低位重定价、宽幅震荡或弱势修复；中期反转仍未确认 — 原始档案未注明" }

          ko: { week: "2차 지지선 테스트 / 약세 박스권 — 48%", month: "약한 회복 또는 넓은 박스권. 반전은 미확인 — 원본 아카이브에 명시되지 않음" },

    const language = document.querySelector("#language");
    const archive = document.querySelector("#archive");
    const pageTitle = document.querySelector("#page-title");
    const languageLabel = document.querySelector("#language-label");

    function formatDateTime(date, time, locale) {
      return new Intl.DateTimeFormat(locale, {
        year: "numeric",
        month: "short",
        day: "numeric",
        timeZone: "UTC"
      }).format(new Date(date + "T00:00:00Z")) + " · " + time;
    }

    function render(selectedLanguage) {
      const t = translations[selectedLanguage];
      document.documentElement.lang = t.lang;
      document.title = t.title;
      pageTitle.textContent = t.title;
      languageLabel.textContent = t.language;

      archive.replaceChildren(...reports.map((report) => {
        const item = report.text[selectedLanguage];
        const article = document.createElement("article");
        article.className = "entry";

        const header = document.createElement("header");
        header.className = "entry-header";
        const heading = document.createElement("h2");
        heading.textContent = formatDateTime(report.date, report.time, t.locale);
        header.append(heading);

        const conclusions = document.createElement("dl");
        conclusions.className = "conclusions";
        const fields = [
          [t.model, report.model, "model-name"],
          [t.week, item.week, ""],
          [t.month, item.month, ""]
        ];

        fields.forEach(([label, value, valueClass]) => {
          const field = document.createElement("div");
          field.className = "conclusion";
          const term = document.createElement("dt");
          term.textContent = label;
          const description = document.createElement("dd");
          description.textContent = value;
          if (valueClass) description.className = valueClass;
          field.append(term, description);
          conclusions.append(field);
        });

        article.append(header, conclusions);
        return article;
      }));
    }

    let savedLanguage = "en";
    try {
      savedLanguage = localStorage.getItem("xau-archive-language") || "en";
    } catch (_) {}

    language.value = translations[savedLanguage] ? savedLanguage : "en";
    render(language.value);

    language.addEventListener("change", () => {
      render(language.value);
      try {
        localStorage.setItem("xau-archive-language", language.value);
      } catch (_) {}
    });
  </script>
</body>
</html>
